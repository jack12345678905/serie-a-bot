name: Run Python Telegram Bot

on:
  schedule:
    # Esegui ogni giorno alle 10:00 UTC
    - cron: '7 6 * * *'    # ~8:07 italiane
    - cron: '12 9 * * *'  # ~11:12 italiane
    - cron: '23 13 * * *'  # ~15:23 italiane
    - cron: '18 15 * * *'  # ~17:18 italiane
  workflow_dispatch:  # permette anche di eseguire manualmente

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pytz certifi Babel

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python bot1.py

        # --- TRUCCO ANTI-BLOCCO 60 GIORNI ---
      - name: Mantieni vivo il repository
        run: |
          echo "Ultimo avvio automatico: $(date)" > keep_alive.txt
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add keep_alive.txt
          git commit -m "Keep-alive automatico [Workflow Run]" || exit 0
          git push
